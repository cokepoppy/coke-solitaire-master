<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d5128" />
    <meta name="description" content="A relaxing, mobile-first Klondike solitaire game." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Solitaire Master</title>
  </head>
  <body>
    <main class="game-shell" id="game-shell">
      <header class="game-topbar" aria-label="Game status and menu">
        <button class="menu-button" id="menu-button" type="button" aria-label="Game menu" title="Game menu">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 9h18M7 16h18M7 23h18" /></svg>
        </button>
        <section class="scorebar" aria-label="Game statistics">
          <div class="stat" aria-label="Score"><svg class="metric-icon crown-icon" viewBox="0 0 32 28" aria-hidden="true"><path d="M3 8 9 13 15 3l5 10 9-7-3 15H6L3 8Z"/><path d="M7 24h19"/></svg><strong id="score-value">0</strong></div>
          <span class="scorebar-flourish" aria-hidden="true">✦</span>
          <div class="stat time-stat" aria-label="Time">
            <svg class="timer-frame" viewBox="0 0 300 96" preserveAspectRatio="none" aria-hidden="true">
              <path class="timer-frame-shape" d="M45 9H116Q135 9 150 1Q165 9 184 9H255C266 9 271 18 277 29L300 48L277 67C271 78 266 87 255 87H184Q165 87 150 95Q135 87 116 87H45C34 87 29 78 23 67L0 48L23 29C29 18 34 9 45 9Z"/>
              <path class="timer-frame-detail" d="M27 48L13 41L20 48L13 55L27 48M273 48L287 41L280 48L287 55L273 48M111 10Q132 12 150 5Q168 12 189 10M111 86Q132 84 150 91Q168 84 189 86"/>
              <path class="timer-frame-jewel" d="M150 7L155 13L150 19L145 13ZM150 77L155 83L150 89L145 83Z"/>
            </svg>
            <strong id="time-value">0:00</strong>
          </div>
          <span class="scorebar-flourish" aria-hidden="true">✦</span>
          <div class="stat" aria-label="Moves"><svg class="metric-icon moves-icon" viewBox="0 0 36 30" aria-hidden="true"><path d="M4 10h23m-6-6 7 6-7 6M32 20H9m6-6-7 6 7 6"/></svg><strong id="moves-value">0</strong></div>
        </section>
      </header>

      <section class="board-wrap" aria-label="Solitaire board">
        <div class="top-row" id="top-row"></div>
        <div class="tableau" id="tableau" aria-label="Seven tableau piles"></div>
      </section>

      <nav class="action-bar" aria-label="Game actions">
        <button class="action-button new-action" id="new-game-button" aria-label="Start a new game" title="New game">
          <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 11v26M11 24h26"/></svg></span><span>Play</span>
        </button>
        <button class="action-button" id="magic-button" aria-label="Use magic move" title="Magic">
          <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="m13 35 20-22M11 12l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5ZM34 25l2 4 4 2-4 2-2 4-2-4-4-2 4-2 2-4Z"/></svg><i class="action-badge" id="magic-badge">1</i></span><span>Magic</span>
        </button>
        <button class="action-button" id="hint-button" aria-label="Show a hint" title="Hint">
          <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 5a13 13 0 0 0-8 23c2 1 3 3 3 5h10c0-2 1-4 3-5a13 13 0 0 0-8-23ZM19 38h10M20 43h8"/><path d="M20 17a5 5 0 0 1 5-5"/></svg></span><span>Hint</span>
        </button>
        <button class="action-button" id="undo-button" aria-label="Undo move" title="Undo">
          <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M11 17H5l8-8 8 8h-6c11-1 18 5 18 14 0 4-2 7-5 9"/></svg></span><span>Undo</span>
        </button>
      </nav>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <div class="modal-backdrop hidden" id="modal-backdrop">
      <section class="modal-card" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close icon-button" id="modal-close" aria-label="Close dialog">×</button>
        <div class="modal-kicker" id="modal-kicker">GAME SETTINGS</div>
        <h1 id="modal-title">Settings</h1>
        <div id="modal-content"></div>
      </section>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
